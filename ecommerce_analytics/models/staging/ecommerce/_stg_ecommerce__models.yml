version: 2

models:
  - name: stg_ecommerce__customers
    description: Cleaned customer records from the raw e-commerce seed data.
    columns:
      - name: customer_id
        description: Unique identifier for a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.
      - name: email
        description: Customer email address, standardized to lowercase.
      - name: signup_date
        description: Date the customer signed up.
      - name: country
        description: Customer country code.
      - name: state
        description: Customer state code.
      - name: city
        description: Customer city.
      - name: marketing_channel
        description: Channel that acquired the customer.
      - name: customer_status
        description: Current customer status from the source system.
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive']

  - name: stg_ecommerce__orders
    description: Cleaned order records with one row per order and the current order status.
    columns:
      - name: order_id
        description: Unique identifier for an order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: order_status
        description: Current order status from the source system.
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled', 'refunded']
      - name: subtotal_amount
        description: Order merchandise amount before discounts, shipping, and tax.
      - name: discount_amount
        description: Discount amount applied at the order level.
      - name: shipping_amount
        description: Shipping amount charged for the order.
      - name: tax_amount
        description: Tax amount charged for the order.
      - name: order_total_amount
        description: Final order total amount from the source system.
      - name: currency
        description: Currency code for the order.

  - name: stg_ecommerce__order_items
    description: Cleaned order line items with one row per product on an order.
    columns:
      - name: order_item_id
        description: Unique identifier for an order line item.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Order that contains this line item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id
      - name: product_id
        description: Product purchased on this line item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__products')
                field: product_id
      - name: quantity
        description: Quantity of the product purchased.
      - name: unit_price_amount
        description: Price per unit at the time of purchase.
      - name: discount_amount
        description: Discount amount applied to the line item.
      - name: line_total_amount
        description: Final line item amount after line-level discounts.

  - name: stg_ecommerce__products
    description: Cleaned product catalog records from the raw e-commerce seed data.
    columns:
      - name: product_id
        description: Unique identifier for a product.
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: Product display name.
      - name: category
        description: Product category, standardized to lowercase.
      - name: subcategory
        description: Product subcategory, standardized to lowercase.
      - name: brand
        description: Product brand.
      - name: sku
        description: Stock keeping unit, standardized to uppercase.
      - name: unit_cost_amount
        description: Estimated cost to the business for one unit.
      - name: list_price_amount
        description: Standard listed price for one unit.
      - name: is_active
        description: Whether the product is currently active in the catalog.
      - name: created_date
        description: Date the product was created in the source system.

  - name: stg_ecommerce__payments
    description: Cleaned payment transaction records, including successful payments and refunds.
    columns:
      - name: payment_id
        description: Unique identifier for a payment transaction.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Order associated with the payment transaction.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id
      - name: payment_date
        description: Date the payment transaction occurred.
      - name: payment_method
        description: Payment method used for the transaction.
      - name: payment_status
        description: Status of the payment transaction.
        data_tests:
          - accepted_values:
              arguments:
                values: ['succeeded', 'refunded', 'voided']
      - name: payment_amount
        description: Payment amount. Refund transactions are stored as negative amounts.
      - name: transaction_id
        description: Source system transaction identifier.
